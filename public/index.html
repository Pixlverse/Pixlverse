    <!-- No title/description/canonical/og here on purpose.
         <SEO> emits those per route and scripts/prerender.js bakes them into
         each page's HTML. A hardcoded copy would appear first in the document
         and win, so every route would advertise the homepage's metadata. -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

    />
